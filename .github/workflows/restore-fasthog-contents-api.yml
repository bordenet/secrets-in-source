# bump: 1794594704
name: restore-fasthog-contents-api
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-fasthog-contents-api.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: PUT fasthog_test.go on main via Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, json, base64, urllib.request, hashlib
          token = os.environ["GH_TOKEN"]
          def api(method, url, data=None):
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "restore-fasthog",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.load(r)
              except Exception as e:
                  body = e.read().decode() if hasattr(e, "read") else ""
                  raise SystemExit(f"{method} {url} failed: {e}\n{body[:800]}")
          raw_url = "https://raw.githubusercontent.com/bordenet/secrets-in-source/cursor/fix-fasthog-final-196f/fasthog_test.go"
          with urllib.request.urlopen(urllib.request.Request(raw_url, headers={"User-Agent": "restore-fasthog"})) as r:
              content = r.read()
          assert content.startswith(b"package main"), content[:40]
          assert len(content) > 40000, len(content)
          assert b'fmt.Fprintf(&content, "# Comment line' in content
          assert hashlib.sha256(content).hexdigest() == "483d513261d3a9191a5989784356c24ecd88ee937b99606d39af3bf9e91c8ec5"
          print("downloaded", len(content), "bytes")
          meta = api("GET", "https://api.github.com/repos/bordenet/secrets-in-source/contents/fasthog_test.go?ref=main")
          body = json.dumps({
              "message": "fix(lint): restore fasthog_test.go with fmt.Fprintf QF1012 fix",
              "content": base64.b64encode(content).decode(),
              "branch": "main",
              "sha": meta["sha"],
          }).encode()
          out = api("PUT", "https://api.github.com/repos/bordenet/secrets-in-source/contents/fasthog_test.go", body)
          print("commit", out["commit"]["html_url"])
          print("size", out["content"]["size"])
          PY
