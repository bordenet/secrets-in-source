name: restore-fasthog
on:
  push:
    paths:
      - '.cursor-restore/fasthog.b64'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fasthog_test.go
        run: |
          set -euxo pipefail
          base64 -d < .cursor-restore/fasthog.b64 | gunzip > fasthog_test.go
          wc -c fasthog_test.go
          test "$(wc -c < fasthog_test.go)" -eq 45088
          head -c 12 fasthog_test.go | tee /tmp/head.txt
          grep -qx 'package main' /tmp/head.txt
          grep -F 'fmt.Fprintf(&content, "# Comment line' fasthog_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fasthog_test.go
          git status
          git commit -m "fix(lint): restore fasthog_test.go and fix staticcheck QF1012"
          git push
