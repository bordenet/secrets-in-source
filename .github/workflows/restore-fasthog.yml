name: restore-fasthog
on:
  push:
    paths:
      - '.cursor-restore/fasthog.b64'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and restore fasthog_test.go
        run: |
          set -euo pipefail
          base64 -d .cursor-restore/fasthog.b64 | gunzip > fasthog_test.go
          test "$(wc -c < fasthog_test.go)" -eq 45088
          head -c 12 fasthog_test.go | grep -qx 'package main'
          grep -q 'fmt.Fprintf(&content, "# Comment line' fasthog_test.go
          rm -rf .cursor-restore
          rm -f .github/workflows/restore-fasthog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fasthog_test.go
          git add -A .cursor-restore .github/workflows/restore-fasthog.yml || true
          git commit -m "fix(lint): restore fasthog_test.go and fix staticcheck QF1012"
          git push
