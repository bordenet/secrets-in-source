name: restore-fasthog-once
on:
  push:
    paths:
      - '.cursor-restore/**'
      - '.github/workflows/restore-fasthog-once.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fasthog_test.go onto branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.cursor-restore/fasthog.b64.part00')
          t = p.read_text()
          t2 = t.replace('rMDL4qiqruV', 'rMDL4liqruV')
          if t2 != t:
              p.write_text(t2)
              print('patched part00 corruption')
          else:
              print('part00 already clean')
          PY
          cat .cursor-restore/fasthog.b64.part00 .cursor-restore/fasthog.b64.part01 .cursor-restore/fasthog.b64.part02 > /tmp/fasthog.b64
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          b64 = pathlib.Path('/tmp/fasthog.b64').read_text().strip()
          raw = gzip.decompress(base64.b64decode(b64))
          assert len(raw) == 45088, len(raw)
          assert raw.startswith(b'package main')
          assert b'fmt.Fprintf(&content, "# Comment line' in raw
          assert hashlib.sha256(raw).hexdigest() == '483d513261d3a9191a5989784356c24ecd88ee937b99606d39af3bf9e91c8ec5'
          pathlib.Path('fasthog_test.go').write_bytes(raw)
          print('restored', len(raw), 'bytes')
          PY
          BRANCH="cursor/restore-fasthog-61e8"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          rm -rf .cursor-restore
          rm -f .github/workflows/restore-fasthog-once.yml
          rm -f .github/workflows/qf1012-restore.yml .github/workflows/restore-fasthog.yml || true
          git add -A
          git status
          git commit -m "fix(lint): restore fasthog_test.go with fmt.Fprintf QF1012 fix"
          git push -u origin "$BRANCH" --force
          if gh pr list --head "$BRANCH" --base main --json number --jq 'length' | grep -qx 0; then
            gh pr create --base main --head "$BRANCH" \
              --title "fix(lint): restore fasthog_test.go with fmt.Fprintf QF1012 fix" \
              --body "Restores fasthog_test.go (45088 bytes) from staged gzip+base64 payload. Removes one-shot restore workflows/staging."
          else
            echo "PR already exists"
            gh pr list --head "$BRANCH" --base main
          fi
