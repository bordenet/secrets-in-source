name: restore-fasthog-once
on:
  push:
    paths:
      - '.cursor-restore/**'
      - '.github/workflows/restore-fasthog-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fasthog_test.go
        run: |
          set -euo pipefail
          cat .cursor-restore/fasthog.b64.part* > /tmp/fasthog.b64
          base64 -d < /tmp/fasthog.b64 | gunzip > fasthog_test.go
          test "$(wc -c < fasthog_test.go)" -eq 45088
          head -c 12 fasthog_test.go | grep -qx 'package main'
          grep -F 'fmt.Fprintf(&content, "# Comment line' fasthog_test.go
          rm -rf .cursor-restore
          rm -f .github/workflows/restore-fasthog-once.yml
          rm -f .github/workflows/qf1012-restore.yml .github/workflows/restore-fasthog.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "fix(lint): restore fasthog_test.go with fmt.Fprintf QF1012 fix"
          git push
